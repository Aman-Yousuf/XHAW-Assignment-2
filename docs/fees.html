<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Course Fees & Calculator - Pawsitive Pet Academy</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="logo">
        <img
          src="images/logo.png"
          alt="Pawsitive Pet Academy Logo"
          width="120"
        />
        <h2>Pawsitive Pet Academy</h2>
      </div>
      <nav>
        <a href="index.html">HOME</a>
        <a href="about.html">ABOUT US</a>
        <a href="overview.html">OVERVIEW</a>
        <a href="services.html">SERVICES</a>
        <a href="fees.html">FEES</a>
        <a href="contact.html">CONTACT</a>
        <a href="booking.html">BOOK US</a>
      </nav>
    </header>

    <main>
      <section class="calculator-section">
        <h2>Course Fee Estimator</h2>
        <p>
          Select the courses you wish to enroll in to estimate your total fees.
        </p>

        <form id="fee-calculator-form">
          <fieldset>
            <legend>Contact Information</legend>
            <div>
              <label for="calc-name">Full Name:</label>
              <input type="text" id="calc-name" name="name" required />
            </div>
            <div>
              <label for="calc-phone">Phone Number:</label>
              <input type="tel" id="calc-phone" name="phone" required />
            </div>
            <div>
              <label for="calc-email">Email Address:</label>
              <input type="email" id="calc-email" name="email" required />
            </div>
          </fieldset>

          <fieldset>
            <legend>Select Courses</legend>
            <div>
              <input type="checkbox" id="course1" name="course" value="1500" />
              <label for="course1">Dog Obedience Training – R1500</label>
            </div>
            <div>
              <input type="checkbox" id="course2" name="course" value="1500" />
              <label for="course2">Pet Grooming – R1500</label>
            </div>
            <div>
              <input type="checkbox" id="course3" name="course" value="1500" />
              <label for="course3">Animal Behaviour – R1500</label>
            </div>
            <div>
              <input type="checkbox" id="course4" name="course" value="1500" />
              <label for="course4">Pet Business Management – R1500</label>
            </div>
            <div>
              <input type="checkbox" id="course5" name="course" value="750" />
              <label for="course5">Puppy Care – R750</label>
            </div>
            <div>
              <input type="checkbox" id="course6" name="course" value="750" />
              <label for="course6">Pet First Aid – R750</label>
            </div>
            <div>
              <input type="checkbox" id="course7" name="course" value="750" />
              <label for="course7">Basic Dog Walking – R750</label>
            </div>
          </fieldset>

          <button type="button" id="btn-calculate">Calculate Total</button>

          <div class="total-display">
            <h3>Total Estimated Cost: <span id="total-amount">R0</span></h3>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
