<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Pet Details | Pawsitive Pet Academy</title>

    <!-- Link to your CSS file -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- Website Header -->
    <header>
      <div class="brand">
        <img src="images/logo.jpeg" alt="Pawsitive Pet Academy logo" />
        <span>Pawsitive Pet Academy</span>
      </div>

      <!-- Main Navigation -->
      <nav>
        <a href="index.html">Home</a>
        <a href="overview.html">Overview</a>
        <a href="services.html">Services</a>
        <a href="fees.html">Fees</a>
        <a href="contact.html">Contact</a>
        <a href="booking.html">Book Us</a>
      </nav>
    </header>
    <!-- Desktop 10: Pet Details Profile Form -->
    <main>
      <section class="pet-details-container">
        <h2>Pet Details</h2>

        <!-- Circular Pet Profile Image -->
        <div class="pet-avatar-wrapper">
          <img
            src="images/rufusDog.jpeg"
            alt="Smiling dog"
            class="pet-avatar"
          />
          <p class="pet-name">Rufus</p>
        </div>

        <!-- Centred Pet Details Form -->
        <form class="pet-details-form">
          <div class="form-group">
            <label for="pet-breed" class="sr-only">Breed</label>
            <input
              type="text"
              id="pet-breed"
              name="breed"
              placeholder="Breed"
            />
          </div>

          <div class="form-group">
            <label for="pet-species" class="sr-only">Species</label>
            <input
              type="text"
              id="pet-species"
              name="species"
              placeholder="Species"
            />
          </div>

          <div class="form-group">
            <label for="pet-age" class="sr-only">Age</label>
            <input type="text" id="pet-age" name="age" placeholder="Age" />
          </div>

          <button type="submit" class="btn-save">Save</button>
        </form>
      </section>
    </main>
  </body>
</html>
