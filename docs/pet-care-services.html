<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pet Care Services - Pawsitive Pet Academy</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- Header and Navigation -->
    <header>
      <div class="brand">
        <img src="images/logo.jpeg" alt="Pawsitive Pet Academy Logo" />
        <span>Pawsitive Pet Academy</span>
      </div>

      <nav>
        <a href="index.html">HOME</a>
        <a href="about.html">ABOUT US</a>
        <a href="courses.html">COURSES</a>
        <a href="fees.html">FEES</a>
        <a href="contact.html">CONTACT US</a>
      </nav>
    </header>

    <!-- Pet Care Services Page Content -->
    <main>
      <section class="pet-care-container">
        <!-- Wide Pet Care Image with Left-Side Title -->
        <div class="pet-care-image">
          <img src="images/dog_cat.jpeg" alt="Dog and cat together" />

          <div class="pet-care-title">
            <h2>Pet Care Services</h2>
          </div>
        </div>

        <!-- Pet Care Information -->
        <div class="pet-care-info-box">
          <p>
            From regular check-ups to daily care, we make sure your pet stays
            happy, healthy and loved.
          </p>

          <h3>Our Services Include:</h3>

          <ul>
            <li>Health Check-ups</li>
            <li>Vaccinations</li>
            <li>Grooming &amp; Hygiene</li>
            <li>Nutrition advice</li>
          </ul>
        </div>

        <!-- Book Now Button -->
        <div class="pet-care-action-container">
          <a href="booking.html" class="pet-care-btn-book"> Book Now &rarr; </a>
        </div>
      </section>
    </main>
  </body>
</html>
